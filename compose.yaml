services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
      POSTGRES_DB: tracker
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - tracker-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tracker"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  tracker-db:
